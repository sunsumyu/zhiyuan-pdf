[workspace]
members = [
    "crates/pdf-viewer-core",
    "crates/pdf-viewer-ui",
    "src-tauri"
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
wasm-bindgen = "0.2"

[profile.dev]
incremental = true
debug = 1 # Reduces PDB size and speeds up linking
