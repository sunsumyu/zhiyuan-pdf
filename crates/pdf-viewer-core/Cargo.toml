[package]
name = "pdf-viewer-core"
version = "0.1.0"
edition = "2021"
authors = ["PDF Viewer Team"]
description = "Pure Rust core for PDF layout analysis and reflow logic."
license = "MIT"
repository = "https://github.com/sunsumyu/zhiyuan-pdf"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
lazy_static = "1.4"
log = { workspace = true }
# For future typography integration
# swash = { version = "0.1", optional = true }

[features]
default = []
wasm = ["serde-wasm-bindgen"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen = { workspace = true }
