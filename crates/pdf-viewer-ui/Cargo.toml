[package]
name = "pdf-viewer-ui"
version = "0.1.0"
edition = "2021"
authors = ["PDF Viewer Team"]
description = "Rust-WASM PDF viewer engine and host adapter."
license = "MIT"
repository = "https://github.com/sunsumyu/zhiyuan-pdf"

[lib]
crate-type = ["cdylib"]

[dependencies]
pdf-viewer-core = { path = "../pdf-viewer-core", features = ["wasm"] }
serde = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "console", "CssStyleDeclaration", "Document", "DomRect", "Element", "HtmlCanvasElement", "HtmlElement", "HtmlImageElement", "ImageBitmap", "Node", "TextMetrics", "Window", "ContextAttributes2d", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
