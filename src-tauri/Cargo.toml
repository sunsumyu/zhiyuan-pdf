[package]
name = "pdf-viewer-standalone"
version = "0.1.0"
description = "Standalone PDF Viewer and Editor"
authors = ["PDF Viewer Team"]
license = "MIT"
edition = "2021"
default-run = "pdf-viewer-standalone"

[lib]
name = "pdf_viewer_standalone"
path = "src/lib.rs"

[[bin]]
name = "pdf-viewer-standalone"
path = "src/main.rs"

[[bin]]
name = "diagnose-pdf"
path = "src/bin/diagnose_pdf.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pdf-viewer-core = { path = "../crates/pdf-viewer-core" }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
base64 = "0.21"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
lopdf = "0.33.0"
image = "0.24"
md5 = "0.7"
rayon = "1.10"
vello = "0.3.0"
cosmic-text = "0.12"
swash = "0.1"
fontdb = "0.16.2"
ttf-parser = "0.25.1"
wgpu = "22.1.0"
uuid = { version = "1.0", features = ["v4", "js"] }
pdf = "0.9"
urlencoding = "2.1.3"
windows-sys = "0.61.2"
memmap2 = "0.9.10"
flate2 = "1.0"
chrono = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
