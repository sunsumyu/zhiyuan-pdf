<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereignty PDF Viewer</title>
    <link rel="stylesheet" href="./src/index.css">
</head>
<body>
    <div id="pdf-viewer-root">
        <!-- Main Navbar / Top Bar -->
        <header class="pdf-navbar">
            <div class="navbar-left">
                <div class="app-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="16" height="16" fill="currentColor"><path d="M320 464c8.8 0 16-7.2 16-16V160H256c-17.7 0-32-14.3-32-32V48H64c-8.8 0-16 7.2-16 16V448c0 8.8 7.2 16 16 16H320zM0 64C0 28.7 28.7 0 64 0H229.5c17 0 33.3 6.7 45.3 18.7l90.5 90.5c12 12 18.7 28.3 18.7 45.3V448c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V64z"/></svg>
                    <span>Sovereignty</span>
                </div>
                <div class="v-divider"></div>
                <div class="toolbar-group">
                    <button id="open-btn" class="nav-btn" title="Open PDF">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" width="14" height="14" fill="currentColor"><path d="M88.7 223.8L0 375.8V96C0 60.7 28.7 32 64 32H181.5c17 0 33.3 6.7 45.3 18.7l26.5 26.5c12 12 28.3 18.7 45.3 18.7H416c35.3 0 64 28.7 64 64v32H144c-22.8 0-43.8 12.1-55.3 31.8zm27.6 16.1C122.1 230 132.6 224 144 224H544c11.5 0 22 6.1 27.7 16.1s5.7 22.3-.1 32.1l-112 192C453.9 474 443.4 480 432 480H32c-11.5 0-22-6.1-27.7-16.1s-5.7-22.3 .1-32.1l112-192z"/></svg>
                    </button>
                    <button id="pdf-save-btn" class="nav-btn" title="Save Changes">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="14" height="14" fill="currentColor"><path d="M64 32C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64H384c35.3 0 64-28.7 64-64V173.3c0-17-6.7-33.3-18.7-45.3L352 50.7C340 38.7 323.7 32 306.7 32H64zm0 96c0-17.7 14.3-32 32-32H288c17.7 0 32 14.3 32 32v64c0 17.7-14.3 32-32 32H96c-17.7 0-32-14.3-32-32V128zM224 288a64 64 0 1 1 0 128 64 64 0 1 1 0-128z"/></svg>
                    </button>
                    <button id="pdf-print-btn" class="nav-btn" title="Print Document">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M128 0C92.7 0 64 28.7 64 64v96h64V64H354.7L384 93.3V160h64V93.3c0-17-6.7-33.3-18.7-45.3L400 18.7C388 6.7 371.7 0 354.7 0H128zM384 352v32 64H128V384 352H384zm64 32h32c17.7 0 32-14.3 32-32V256c0-35.3-28.7-64-64-64H64c-35.3 0-64 28.7-64 64v96c0 17.7 14.3 32 32 32H64v64c0 35.3 28.7 64 64 64H384c35.3 0 64-28.7 64-64V384zm-16-88a24 24 0 1 1 0 48 24 24 0 1 1 0-48z"/></svg>
                    </button>
                </div>
            </div>

            <div class="navbar-center">
                <div class="toolbar-group">
                    <button id="pdf-undo-btn" class="nav-btn" title="Undo">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M125.7 160H176c17.7 0 32 14.3 32 32s-14.3 32-32 32H48c-17.7 0-32-14.3-32-32V64c0-17.7 14.3-32 32-32s32 14.3 32 32v51.2L97.6 97.6c87.5-87.5 229.3-87.5 316.8 0s87.5 229.3 0 316.8s-229.3 87.5-316.8 0c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0c62.5 62.5 163.8 62.5 226.3 0s62.5-163.8 0-226.3s-163.8-62.5-226.3 0L125.7 160z"/></svg>
                    </button>
                    <button id="pdf-redo-btn" class="nav-btn" title="Redo">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M386.3 160H336c-17.7 0-32 14.3-32 32s14.3 32 32 32H464c17.7 0 32-14.3 32-32V64c0-17.7-14.3-32-32-32s-32 14.3-32 32v51.2L414.4 97.6c-87.5-87.5-229.3-87.5-316.8 0s-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3s163.8-62.5 226.3 0L386.3 160z"/></svg>
                    </button>
                </div>
                <div class="v-divider"></div>
                <div class="toolbar-group">
                    <button id="pdf-prev-page-btn" class="nav-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" width="12" height="14" fill="currentColor"><path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l192 192c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L77.3 256 246.6 86.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-192 192z"/></svg></button>
                    <div class="page-counter">
                        <input type="text" id="pdf-current-page-input" value="1">
                        <span>/</span>
                        <span id="pdf-total-pages">0</span>
                    </div>
                    <button id="pdf-next-page-btn" class="nav-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" width="12" height="14" fill="currentColor"><path d="M310.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L242.7 256 73.4 86.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l192 192z"/></svg></button>
                </div>
                <div class="v-divider"></div>
                <div class="toolbar-group">
                    <button id="pdf-zoom-out-btn" class="nav-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM136 184c-13.3 0-24 10.7-24 24s10.7 24 24 24H280c13.3 0 24-10.7 24-24s-10.7-24-24-24H136z"/></svg></button>
                    <select id="pdf-zoom-select" class="zoom-select">
                        <option value="0.5">50%</option>
                        <option value="0.75">75%</option>
                        <option value="1.0" selected>100%</option>
                        <option value="1.25">125%</option>
                        <option value="1.5">150%</option>
                        <option value="2.0">200%</option>
                    </select>
                    <button id="pdf-zoom-in-btn" class="nav-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM232 136c0-13.3-10.7-24-24-24s-24 10.7-24 24V184H136c-13.3 0-24 10.7-24 24s10.7 24 24 24h48v48c0 13.3 10.7 24 24 24s24-10.7 24-24V232h48c13.3 0 24-10.7 24-24s-10.7-24-24-24H232V136z"/></svg></button>
                </div>
            </div>

            <div class="navbar-right">
                <div class="toolbar-group">
                    <button id="pdf-search-btn" class="nav-btn" title="Find in Document">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>
                    </button>
                    <button id="pdf-ai-toggle-btn" class="nav-btn ai-btn" title="AI Assistant">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" width="16" height="14" fill="currentColor"><path d="M320 0c17.7 0 32 14.3 32 32V96H480c35.3 0 64 28.7 64 64V448c0 35.3-28.7 64-64 64H160c-35.3 0-64-28.7-64-64V160c0-35.3 28.7-64 64-64H288V32c0-17.7 14.3-32 32-32zM208 384a32 32 0 1 0 0-64 32 32 0 1 0 0 64zm128 0a32 32 0 1 0 0-64 32 32 0 1 0 0 64zm128-32a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zM208 256a32 32 0 1 0 0-64 32 32 0 1 0 0 64zm128-32a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zm96 32a32 32 0 1 0 0-64 32 32 0 1 0 0 64zM576 240h-32c-8.8 0-16 7.2-16 16s7.2 16 16 16h32c8.8 0 16-7.2 16-16s-7.2-16-16-16zM96 240H64c-8.8 0-16 7.2-16 16s7.2 16 16 16h32c8.8 0 16-7.2 16-16s-7.2-16-16-16z"/></svg>
                        <span>AI Assistant</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Secondary Sub-Toolbar (Contextual Tools) -->
        <div class="pdf-sub-toolbar">
            <div class="toolbar-group">
                <button id="pdf-select-mode-btn" class="tool-btn active" title="Select Tool">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" width="12" height="14" fill="currentColor"><path d="M0 55.2V426c0 12.2 9.9 22 22 22c6.3 0 12.4-2.7 16.6-7.5L121.2 346l58.1 116.3c7.9 15.8 27.1 22.2 42.9 14.3s22.2-27.1 14.3-42.9L179.8 320H297.9H298c12.2 0 22.1-9.9 22.1-22.1c0-6.3-2.7-12.3-7.4-16.5L38.6 38.9C34.3 35.1 28.7 33.1 23 33.6C10.3 34.7 0 45.1 0 55.2z"/></svg>
                </button>
                <button id="pdf-hand-mode-btn" class="tool-btn" title="Hand Tool">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32V240H192V144c0-17.7-14.3-32-32-32s-32 14.3-32 32v96 16 48H112V224c0-17.7-14.3-32-32-32s-32 14.3-32 32V384c0 88.4 71.6 160 160 160H304c79.5 0 147.4-55 163.8-132.9l3.3-15.2c3.5-16 5-32.3 4.4-48.6l-2-49.1C472.9 283 471 269 467 256c-5.7-19.2-17.3-36.4-33.9-48.3c-9-6.5-19.4-10.1-30.1-10.7V144c0-17.7-14.3-32-32-32s-32 14.3-32 32v96H320V32z"/></svg>
                </button>
            </div>
            <div class="v-divider"></div>
            <div class="toolbar-group">
                <button id="pdf-add-text-btn" class="tool-btn" title="Add Text">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="14" height="14" fill="currentColor"><path d="M254 52.8C249.3 40.3 237.3 32 224 32s-25.3 8.3-30 20.8L57.8 416H32c-17.7 0-32 14.3-32 32s14.3 32 32 32h96c17.7 0 32-14.3 32-32s-14.3-32-32-32h-1.8l18-48H304l18 48H320c-17.7 0-32 14.3-32 32s14.3 32 32 32h96c17.7 0 32-14.3 32-32s-14.3-32-32-32H390.2L254 52.8zM279.8 304H168.2L224 155.1 279.8 304z"/></svg>
                </button>
                <button id="pdf-draw-btn" class="tool-btn" title="Draw">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M362.7 19.3L314.3 67.7 444.3 197.7l48.4-48.4c25-25 25-65.5 0-90.5L453.3 19.3c-25-25-65.5-25-90.5 0zm-71 71L58.6 323.5c-10.4 10.4-18 23.3-22.2 37.4L1 481.2C-1.5 489.7 .8 498.8 7 505s15.3 8.5 23.7 6.1l120.3-35.4c14.1-4.2 27-11.8 37.4-22.2L421.7 220.3 291.7 90.3z"/></svg>
                </button>
                <button id="pdf-highlight-btn" class="tool-btn" title="Highlight">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" width="16" height="14" fill="currentColor"><path d="M315 315l158.4-215L444.1 70.6 229 229 315 315zm-187 5l0 0-17.8 10.7-3.2 18.1 2.1 2.1 18.1-3.2L337 315 224 202 128 320zm249-266.3L474.9 265.5 371.5 409.4l-81 48.6L128 320 276.7 53.7zM64 368l96 96-144 48 48-144z"/></svg>
                </button>
            </div>
            <div class="v-divider"></div>
            <div class="toolbar-group" id="format-toolbar" style="opacity: 0.5; pointer-events: none;">
                <button id="pdf-format-bold-btn" class="tool-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="12" height="14" fill="currentColor"><path d="M0 64C0 46.3 14.3 32 32 32H80 96 224c70.7 0 128 57.3 128 128c0 31.3-11.3 60-30.5 80.1C251.1 218 288 272.1 288 336c0 80-64 144-144 144H96 80 32c-17.7 0-32-14.3-32-32s14.3-32 32-32H48V96H32C14.3 96 0 81.7 0 64zM112 224H224c35.3 0 64-28.7 64-64s-28.7-64-64-64H112V224zM112 288V416H256c44.2 0 80-35.8 80-80s-35.8-80-80-80H112z"/></svg></button>

                <button id="pdf-format-italic-btn" class="tool-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="12" height="14" fill="currentColor"><path d="M128 64c0-17.7 14.3-32 32-32H352c17.7 0 32 14.3 32 32s-14.3 32-32 32H293.3L160 416h64c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H90.7L224 96H160c-17.7 0-32-14.3-32-32z"/></svg></button>
                <button id="pdf-format-underline-btn" class="tool-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="14" height="14" fill="currentColor"><path d="M16 64c0-17.7 14.3-32 32-32h32c17.7 0 32 14.3 32 32V224c0 53 43 96 96 96s96-43 96-96V64c0-17.7 14.3-32 32-32h32c17.7 0 32 14.3 32 32V224c0 88.4-71.6 160-160 160s-160-71.6-160-160V64zm0 384c0-17.7 14.3-32 32-32H400c17.7 0 32 14.3 32 32s-14.3 32-32 32H48c-17.7 0-32-14.3-32-32z"/></svg></button>
                <div class="color-picker-wrapper">
                    <input type="color" id="pdf-format-color-input" value="#ffffff">
                </div>
            </div>
            <div style="flex: 1;"></div>
            <div class="file-info">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="12" height="14" fill="currentColor"><path d="M320 464c8.8 0 16-7.2 16-16V160H256c-17.7 0-32-14.3-32-32V48H64c-8.8 0-16 7.2-16 16V448c0 8.8 7.2 16 16 16H320zM0 64C0 28.7 28.7 0 64 0H229.5c17 0 33.3 6.7 45.3 18.7l90.5 90.5c12 12 18.7 28.3 18.7 45.3V448c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V64z"/></svg>
                <span id="file-path">No file selected</span>
            </div>
        </div>

        <div class="pdf-main-container">
            <!-- Left Sidebar: Thumbnails / Outline -->
            <aside class="pdf-sidebar-left" id="pdf-sidebar-left">
                <div class="sidebar-tabs">
                <button class="sidebar-tab active" title="Thumbnails"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M448 80c8.8 0 16 7.2 16 16V415.8l-5-6.5-112-144c-4.5-5.9-11.6-9.3-19-9.3s-14.4 3.4-19 9.3L261 385l-29.7-44.5c-4.6-6.9-12.2-11-20.3-11s-15.7 4.1-20.3 11l-96 144H64c-8.8 0-16-7.2-16-16V96c0-8.8 7.2-16 16-16H448zm64 16c0-35.3-28.7-64-64-64H64C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V96zm-214.4 45.8a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg></button>
                <button class="sidebar-tab" title="Outline"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M64 144a48 48 0 1 0 0-96 48 48 0 1 0 0 96zM192 64c-17.7 0-32 14.3-32 32s14.3 32 32 32H480c17.7 0 32-14.3 32-32s-14.3-32-32-32H192zm0 160c-17.7 0-32 14.3-32 32s14.3 32 32 32H480c17.7 0 32-14.3 32-32s-14.3-32-32-32H192zm0 160c-17.7 0-32 14.3-32 32s14.3 32 32 32H480c17.7 0 32-14.3 32-32s-14.3-32-32-32H192zM64 464a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm48-208a48 48 0 1 0 -96 0 48 48 0 1 0 96 0z"/></svg></button>
                <button class="sidebar-tab" title="Bookmarks"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="12" height="14" fill="currentColor"><path d="M0 48V487.7C0 501.1 10.9 512 24.3 512c5 0 9.9-1.5 14-4.4L192 400 345.7 507.6c4.1 2.9 9 4.4 14 4.4c13.4 0 24.3-10.9 24.3-24.3V48c0-26.5-21.5-48-48-48H48C21.5 0 0 21.5 0 48z"/></svg></button>
            </div>
                <div class="sidebar-content" id="pdf-thumbnails-container">
                    <div class="sidebar-empty">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" width="32" height="28" fill="currentColor" style="opacity:0.3"><path d="M160 80H512c8.8 0 16 7.2 16 16V320c0 8.8-7.2 16-16 16H490.8L388.1 178.9c-4.4-6.8-12-10.9-20.1-10.9s-15.7 4.1-20.1 10.9l-52.2 79.8-12.4-16.9c-4.5-6.2-11.7-9.8-19.4-9.8s-14.9 3.6-19.4 9.8L175.6 336H160c-8.8 0-16-7.2-16-16V96c0-8.8 7.2-16 16-16zM96 96V320c0 35.3 28.7 64 64 64H512c35.3 0 64-28.7 64-64V96c0-35.3-28.7-64-64-64H160c-35.3 0-64 28.7-64 64zM48 120c0-13.3-10.7-24-24-24S0 106.7 0 120V344c0 75.1 60.9 136 136 136H456c13.3 0 24-10.7 24-24s-10.7-24-24-24H136c-48.6 0-88-39.4-88-88V120zm208 24a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg>
                    <p>Thumbnails</p>
                </div>
                </div>
                <div class="sidebar-footer">
                    <button id="pdf-sidebar-toggle-btn" class="sidebar-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="10" height="14" fill="currentColor"><path d="M9.4 278.6c-12.5-12.5-12.5-32.8 0-45.3l160-160c12.5-12.5 32.8-12.5 45.3 0s12.5 32.8 0 45.3L77.3 256l137.4 137.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0l-160-160zm352 160l-160-160c-12.5-12.5-12.5-32.8 0-45.3l160-160c12.5-12.5 32.8-12.5 45.3 0s12.5 32.8 0 45.3L269.3 256l137.4 137.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0z"/></svg>
                </button>
                </div>
            </aside>

            <!-- Center Area: PDF Content -->
            <main id="pdf-scroll-container">
                <div id="pdf-empty-state">
                    <div class="hero-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="64" height="80" fill="currentColor"><path d="M320 464c8.8 0 16-7.2 16-16V160H256c-17.7 0-32-14.3-32-32V48H64c-8.8 0-16 7.2-16 16V448c0 8.8 7.2 16 16 16H320zM0 64C0 28.7 28.7 0 64 0H229.5c17 0 33.3 6.7 45.3 18.7l90.5 90.5c12 12 18.7 28.3 18.7 45.3V448c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V64z"/></svg>
                    </div>
                    <h2>Welcome to Sovereignty PDF</h2>
                    <p>Open a document to start viewing and editing with AI assistance.</p>
                    <button id="open-empty-state-btn" class="primary-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="12" height="14" fill="currentColor" style="margin-right:6px"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"/></svg> Open PDF File
                    </button>
                </div>

                <div id="pdf-content-wrapper">
                    <canvas id="pdf-render-target"></canvas>
                    <div id="vector-render-container"></div>
                </div>
            </main>

            <!-- Right Sidebar: AI Panel -->
            <aside class="pdf-side-panel" id="pdf-ai-panel" style="display: none;">
                <div class="panel-header">
                    <div class="panel-title-group">
                        <div class="ai-avatar">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" width="16" height="14" fill="currentColor"><path d="M320 0c17.7 0 32 14.3 32 32V96H480c35.3 0 64 28.7 64 64V448c0 35.3-28.7 64-64 64H160c-35.3 0-64-28.7-64-64V160c0-35.3 28.7-64 64-64H288V32c0-17.7 14.3-32 32-32zM208 384a32 32 0 1 0 0-64 32 32 0 1 0 0 64zm128 0a32 32 0 1 0 0-64 32 32 0 1 0 0 64zm128-32a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zM208 256a32 32 0 1 0 0-64 32 32 0 1 0 0 64zm128-32a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zm96 32a32 32 0 1 0 0-64 32 32 0 1 0 0 64zM576 240h-32c-8.8 0-16 7.2-16 16s7.2 16 16 16h32c8.8 0 16-7.2 16-16s-7.2-16-16-16zM96 240H64c-8.8 0-16 7.2-16 16s7.2 16 16 16h32c8.8 0 16-7.2 16-16s-7.2-16-16-16z"/></svg>
                        </div>
                        <div class="panel-title-text">
                            <span class="panel-title">Resume AI Assistant</span>
                            <span id="pdf-ai-status" class="status-dot"></span>
                        </div>
                    </div>
                    <div class="panel-actions">
                        <button id="pdf-ai-wide-btn" class="icon-btn" title="Toggle Wide Mode"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zM281 385c9.4 9.4 24.6 9.4 33.9 0s9.4-24.6 0-33.9l-71-71L304 209c9.4-9.4 9.4-24.6 0-33.9s-24.6-9.4-33.9 0l-88 88c-9.4 9.4-9.4 24.6 0 33.9L281 385z"/></svg></button>
                        <button id="pdf-ai-close-btn" class="icon-btn" title="Close"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="12" height="14" fill="currentColor"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg></button>
                    </div>
                </div>

                <div id="pdf-ai-doc-meta" class="ai-meta-bar">
                    <span>Scope: Current Page</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM216 336h24V272H216c-13.3 0-24-10.7-24-24s10.7-24 24-24h48c13.3 0 24 10.7 24 24v88h8c13.3 0 24 10.7 24 24s-10.7 24-24 24H216c-13.3 0-24-10.7-24-24s10.7-24 24-24zm40-208a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"/></svg>
                </div>
                
                <div class="panel-content" id="resume-ai-panel-scroll">
                    <div id="pdf-ai-chat-messages"></div>
                </div>

                <div class="ai-input-area">
                    <div id="pdf-ai-actions-summary" class="ai-suggestions-preview">
                        No suggestions yet
                    </div>

                    <div id="pdf-ai-api-key-section" class="ai-key-section">
                        <div id="pdf-ai-key-summary">
                            <span id="pdf-ai-key-summary-inline"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor" style="margin-right:4px;vertical-align:middle"><path d="M336 352c97.2 0 176-78.8 176-176S433.2 0 336 0S160 78.8 160 176c0 18.7 2.9 36.8 8.3 53.7L7 391c-4.5 4.5-7 10.6-7 17v80c0 13.3 10.7 24 24 24h80c13.3 0 24-10.7 24-24V448h40c13.3 0 24-10.7 24-24V384h40c6.4 0 12.5-2.5 17-7l33.3-33.3c16.9 5.4 35 8.3 53.7 8.3zm40-176a40 40 0 1 1 -80 0 40 40 0 1 1 80 0z"/></svg> Checking API Key...</span>
                            <button id="pdf-ai-key-edit-btn" class="link-btn">Edit</button>
                        </div>
                        <div id="pdf-ai-key-editor" style="display: none;">
                            <input type="password" id="pdf-ai-api-key" placeholder="Enter Gemini API Key...">
                            <div class="btn-group">
                                <button id="pdf-ai-save-key" class="compact-btn primary">Save</button>
                                <button id="pdf-ai-cancel-key-edit" class="compact-btn">Cancel</button>
                            </div>
                        </div>
                    </div>

                    <div class="ai-chat-controls">
                        <div class="chat-header-actions">
                            <select id="pdf-ai-scope-select" class="scope-select">
                                <option value="current-page">Current Page</option>
                                <option value="whole-document">Whole Resume</option>
                            </select>
                            <button id="pdf-ai-clear-btn" class="link-btn">Clear Chat</button>
                        </div>
                        <div class="chat-input-wrapper">
                            <textarea id="pdf-ai-chat-input" placeholder="Ask AI to modify your resume..."></textarea>
                            <button id="pdf-ai-send-btn" class="send-btn" title="Send message">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor"><path d="M498.1 5.6c10.1 7 15.4 19.1 13.5 31.2l-64 416c-1.5 9.7-7.4 18.2-16 23s-18.9 5.4-28 1.6L284 427.7l-68.5 74.1c-8.9 9.7-22.9 12.9-35.2 8.1S160 493.2 160 480V396.4c0-4 1.5-7.8 4.2-10.7L331.8 202.8c5.8-6.3 5.6-16-.4-22s-15.7-6.4-22-.7L106 360.8 17.7 316.6C7.1 311.3 .3 300.7 0 288.9s5.9-22.8 16.1-28.7l448-256c10.7-6.1 23.9-5.5 34 1.4z"/></svg>
                            </button>
                        </div>
                        <div class="chat-footer-actions">
                            <button id="pdf-ai-apply-all-btn" class="outline-btn" disabled>Apply All</button>
                            <button id="pdf-ai-save-as-btn" class="outline-btn" disabled>Save As...</button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Floating Find Container -->
    <div id="pdf-find-container" style="display: none;">
        <div class="find-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="14" height="14" fill="currentColor" class="find-icon"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>
            <input type="text" id="pdf-find-input" placeholder="Find in document...">
            <span id="pdf-find-results">0 / 0</span>
            <div class="v-divider"></div>
            <button id="pdf-find-prev-btn" class="icon-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="12" height="14" fill="currentColor"><path d="M233.4 105.4c12.5-12.5 32.8-12.5 45.3 0l192 192c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L256 173.3 86.6 342.6c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3l192-192z"/></svg></button>
            <button id="pdf-find-next-btn" class="icon-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="12" height="14" fill="currentColor"><path d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z"/></svg></button>
            <button id="pdf-find-close-btn" class="icon-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="12" height="14" fill="currentColor"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg></button>
        </div>
    </div>

    <!-- 快速响应：Open 按钮不等任何模块加载，直接调用 Tauri 全局 API (withGlobalTauri=true) -->
    <script>
    (function() {
        var openBtn = document.getElementById('open-btn');
        if (!openBtn) return;
        openBtn.addEventListener('click', function() {
            // 如果主模块已加载且挂了高级处理器，优先用它（避免重复对话框）
            if (window.__pdfOpenHandler) {
                window.__pdfOpenHandler();
                return;
            }
            // 否则用 Tauri 全局 API 直接调用后端 pick_file。
            var tauri = window.__TAURI__;
            if (!tauri || !tauri.core || !tauri.core.invoke) return;
            tauri.core.invoke('pick_file', {})
                .then(function(selected) {
                    if (!selected) return;
                    // 存起来等主模块就绪后消费
                    window.__pendingPdfPath = selected;
                    document.getElementById('file-path').textContent = selected;
                });
        });
    })();
    </script>
    <script type="module" src="/src/main.ts"></script>
    <input type="file" id="pdf-hidden-file-input" accept=".pdf" style="display: none;">
</body>
