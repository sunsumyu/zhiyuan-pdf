# rust-analyzer workspace config (read by rust-analyzer 0.4+ natively).
#
# Why we need this: pdf-viewer-ui is wasm32-only (cdylib + js-sys/web-sys
# under target.'cfg(target_arch = "wasm32")'.dependencies), but src-tauri
# is native-only. With the default single-target check, one of the two
# always shows red squiggles.
#
# By listing BOTH targets here, rust-analyzer runs `cargo check` against
# each and a diagnostic is suppressed if it disappears in any target.
# An item like `js_sys::Function` resolves under wasm32 → no error;
# an item like `tauri::Manager` resolves under x86_64 → no error.
# Tradeoff: every save triggers two cargo checks (~2x analysis time).

# [cargo.target] (singular) drives ANALYSIS — name resolution, proc-macro
# expansion, the engine that produces inline red squiggles like the one on
# `#[wasm_bindgen]`. Setting it to wasm32 makes pdf-viewer-ui clean.
# Side effect: src-tauri's analysis runs against wasm32 too, so it may show
# inline red. But [check] below still gives src-tauri its native cargo-check
# diagnostics, so real build errors won't be hidden.
[cargo]
target = "wasm32-unknown-unknown"

# [check.targets] (plural) drives CARGO CHECK — the diagnostics shown in the
# Problems panel and along the file gutter. Listing both targets makes
# rust-analyzer run two checks; an item is only flagged red if it fails on
# every listed target.
[check]
targets = ["wasm32-unknown-unknown", "x86_64-pc-windows-msvc"]
